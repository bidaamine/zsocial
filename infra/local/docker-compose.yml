version: '3.8'

services:
  nexus_postgresql:
    image: postgres:15
    container_name: nexus_postgresql
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexus_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nexus_redis_cache:
    image: redis:7
    container_name: nexus_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nexus_neo4j_graph_db:
    image: neo4j:5
    container_name: nexus_neo4j_graph_db
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data

  nexus_zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nexus_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  nexus_kafka_event_stream:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nexus_kafka_event_stream
    depends_on:
      - nexus_zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: nexus_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  nexus_object_storage:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    container_name: nexus_object_storage
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  nexus_timeseries_db:
    image: timescale/timescaledb:latest-pg15
    container_name: nexus_timeseries_db
    environment:
      POSTGRES_USER: nexus_ts
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nexus_telemetry
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  nexus_flink_stream_processor:
    image: flink:1.17
    container_name: nexus_flink_jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: nexus_flink_jobmanager

  nexus_data_warehouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: nexus_data_warehouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
